services:
  app:
    build:
      context: .
    container_name: academic-events-api
    environment:
      APP_PORT: 7070
      DB_PORT: 9092
      DB_PATH: /var/lib/academic-events/academic-events
      DB_ALLOW_REMOTE_CONNECTIONS: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ChangeMe123!
      ADMIN_FULL_NAME: Administrador Principal
      ADMIN_EMAIL: admin@pucmm.local
    volumes:
      - academic_events_data:/var/lib/academic-events
    expose:
      - "7070"

  nginx:
    image: nginx:1.27-alpine
    container_name: academic-events-proxy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  academic_events_data:
